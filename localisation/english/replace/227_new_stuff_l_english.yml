 # Machine Guns & Anti-Air
 additional_machine_guns_tech:0 "Additional Machineguns"
 additional_machine_guns_tech_desc:0 "Mounting supplementary machine guns on the hull increases the vehicle's anti-infantry capabilities."
 tank_heavy_machine_gun_tech:0 "Anti-Air Machine Gun"
 tank_heavy_machine_gun_tech_desc:0 "A roof-mounted machine gun provides a reliable deterrent against low-flying aircraft and light vehicles."
 tank_anti_air_cannon_tech:0 "Anti-Air Cannon I"
 tank_anti_air_cannon_tech_desc:0 "Replacing the standard turret with a dedicated anti-air cannon allows the chassis to protect columns from enemy close air support."
 tank_anti_air_cannon_2_tech:0 "Anti-Air Cannon II"
 tank_anti_air_cannon_2_tech_desc:0 "Improved rapid-fire autocannons provide a much denser wall of flak against modern aircraft."
 tank_anti_air_cannon_3_tech:0 "Anti-Air Cannon III"
 tank_anti_air_cannon_3_tech_desc:0 "The pinnacle of mobile anti-air, featuring multiple heavy-caliber barrels for devastating defensive fire."
 coaxial_machine_guns_tech:0 "Coaxial Machine Gun"
 coaxial_machine_guns_tech_desc:0 "Integrating a machine gun directly next to the main cannon allows the gunner to suppress infantry without wasting valuable main gun ammunition."
 close_defense_mortar_tech:0 "Close Defense Mortar"
 close_defense_mortar_tech_desc:0 "An internally loaded roof mortar that allows the crew to fire smoke and fragmentation charges at encroaching infantry without exposing themselves."

 # Light Guns
 anti_tank_rifle_tech:0 "Anti-Tank Rifle"
 anti_tank_rifle_tech_desc:0 "A heavy-caliber rifle capable of punching through early, thin-skinned tankettes and armored cars."
 tank_auto_cannon_tech:0 "Auto Cannon I"
 tank_auto_cannon_tech_desc:0 "Early rapid-fire 20mm cannons designed to quickly chew through light armor and infantry positions."
 tank_auto_cannon_2_tech:0 "Auto Cannon II"
 tank_auto_cannon_2_tech_desc:0 "Refined autocannon designs featuring longer barrels and higher rates of fire."
 tank_auto_cannon_3_tech:0 "Auto Cannon III"
 tank_auto_cannon_3_tech_desc:0 "Heavy 30mm to 50mm rapid-fire cannons, pushing the limits of what a light turret ring can handle."
 tank_small_cannon_tech:0 "Small Cannon I"
 tank_small_cannon_tech_desc:0 "Basic 37mm and 45mm anti-tank guns mounted into light tanks for standard combat operations."
 tank_small_cannon_2_tech:0 "Small Cannon II"
 tank_small_cannon_2_tech_desc:0 "High-velocity 50mm cannons designed to defeat the thicker armor of modern light and early medium tanks."
 tank_small_cannon_3_tech:0 "Small Cannon III"
 tank_small_cannon_3_tech_desc:0 "The absolute limit of light tank armaments, maximizing penetration at the cost of turret ergonomics."
 light_squeezebore_cannon_tech:0 "Light Squeeze-Bore Cannon"
 light_squeezebore_cannon_tech_desc:0 "A tapered-bore adapter that squeezes the projectile down as it travels, resulting in extreme muzzle velocities to punch through heavy armor."

 # Howitzers & Rockets
 tank_close_support_gun_tech:0 "Close Support Gun"
 tank_close_support_gun_tech_desc:0 "A short-barreled, low-velocity gun designed purely to lob high-explosive shells into fortified infantry positions."
 tank_medium_howitzer_tech:0 "Medium Howitzer I"
 tank_medium_howitzer_tech_desc:0 "Adapting standard 105mm field artillery into a mobile casemate or heavy turret for direct assault."
 tank_medium_howitzer_2_tech:0 "Medium Howitzer II"
 tank_medium_howitzer_2_tech_desc:0 "Refined recoil mechanisms and venting systems allow for a much more efficient 105mm assault gun."
 tank_heavy_howitzer_tech:0 "Heavy Howitzer I"
 tank_heavy_howitzer_tech_desc:0 "Pushing the chassis to its physical limits by mounting a massive 150mm bunker-busting siege cannon."
 tank_heavy_howitzer_2_tech:0 "Heavy Howitzer II"
 tank_heavy_howitzer_2_tech_desc:0 "The ultimate city-leveler. A perfected, heavily armored heavy howitzer mount designed for sheer destructive power."
 tank_rocket_launcher_tech:0 "Rocket Launcher I"
 tank_rocket_launcher_tech_desc:0 "External racks mounting heavy unguided rockets to provide overwhelming, localized fire support."
 tank_rocket_launcher_2_tech:0 "Rocket Launcher II"
 tank_rocket_launcher_2_tech_desc:0 "Turret-mounted, multi-tube rocket batteries capable of devastating area saturation."

 # Main Cannons
 tank_medium_cannon_tech:0 "Medium Cannon I"
 tank_medium_cannon_tech_desc:0 "Standard 75mm and 76mm guns offering a reliable balance of anti-tank capability and high-explosive filler."
 tank_high_velocity_cannon_tech:0 "High Velocity Cannon I"
 tank_high_velocity_cannon_tech_desc:0 "Long-barreled cannons designed specifically to out-range and penetrate modern enemy armor."
 tank_high_velocity_cannon_2_tech:0 "High Velocity Cannon II"
 tank_high_velocity_cannon_2_tech_desc:0 "Advanced, extreme-velocity 75mm guns acting as dedicated tank-snipers."
 tank_high_velocity_cannon_3_tech:0 "High Velocity Cannon III"
 tank_high_velocity_cannon_3_tech_desc:0 "Experimental hyper-velocity cannons utilizing sabot ammunition for unparalleled kinetic penetration."
 tank_medium_cannon_2_tech:0 "Medium Cannon II"
 tank_medium_cannon_2_tech_desc:0 "Highly reliable, general-purpose 76mm and 85mm guns optimized for mass production and ergonomic turret integration."
 tank_heavy_cannon_tech:0 "Heavy Cannon I"
 tank_heavy_cannon_tech_desc:0 "Adapting massive 88mm and 90mm anti-aircraft guns into armored vehicles for overwhelming kinetic damage."
 tank_heavy_cannon_2_tech:0 "Heavy Cannon II"
 tank_heavy_cannon_2_tech_desc:0 "Terrifyingly large 88mm and 122mm cannons designed to dominate the battlefield and shatter enemy heavy tanks."
 tank_heavy_cannon_3_tech:0 "Heavy Cannon III"
 tank_heavy_cannon_3_tech_desc:0 "Monstrous super-heavy cannons that trade all mobility and reliability for the ability to destroy anything they hit."

 # Optics & Fire Control
 early_optics_tech:0 "Early Optics"
 early_optics_tech_desc:0 "Standard telescopic sights with fixed reticles. Basic, but functional."
 improved_optics_tech:0 "Improved Optics"
 improved_optics_tech_desc:0 "Articulated sights and superior glass clarity allow the gunner to acquire targets without severe glare."
 range_finder_tech:0 "Rangefinder"
 range_finder_tech_desc:0 "Dedicated stereoscopic optics that accurately calculate target distance, dramatically improving first-shot accuracy at long range."
 advanced_range_finder_tech:0 "Advanced Rangefinder"
 advanced_range_finder_tech_desc:0 "High-end coincidence rangefinders guaranteeing lethal accuracy at extreme engagement distances."
 stabilizer_tech:0 "Stabilizer"
 stabilizer_tech_desc:0 "Basic mechanical shoulder-stops and elevation dampeners to keep the gun relatively steady over rough terrain."
 power_traverse_tech:0 "Power Traverse"
 power_traverse_tech_desc:0 "Hydraulic and electric motors replace manual hand-cranks, allowing the heavy turret to snap quickly to new threats."
 gyrostabilizer_tech:0 "Gyrostabilizer"
 gyrostabilizer_tech_desc:0 "A complex electro-mechanical gyroscope system that allows the tank to accurately fire on the move."

 # Ammo Storage
 extra_ammo_storage_tech:0 "Extra Ammunition Storage"
 extra_ammo_storage_tech_desc:0 "Cramming extra shells into every available corner of the hull to keep the tank in the fight longer, at the risk of catastrophic cook-offs."
 wet_ammo_storage_tech:0 "Wet Ammo Storage"
 wet_ammo_storage_tech_desc:0 "Surrounding the ammunition bins with liquid jackets to suppress fires and drastically improve vehicle survivability when penetrated."
 auto_loader_tech:0 "Autoloader"
 auto_loader_tech_desc:0 "A highly complex mechanical carousel that feeds shells directly into the breech, maximizing fire rate and removing the human loader."

 # Survivability & Utility
 smoke_launchers_tech:0 "Smoke Launchers"
 smoke_launchers_tech_desc:0 "Basic mechanical racks that drop smoke candles behind the tank, allowing it to break line-of-sight and retreat."
 improved_ergonomics_tech:0 "Improved Ergonomics"
 improved_ergonomics_tech_desc:0 "Spacious turrets, padded seats, and spring-loaded hatches keep the crew comfortable, alert, and alive."
 easy_maintenance_tech:0 "Easy Maintenance"
 easy_maintenance_tech_desc:0 "Standardizing parts and enlarging transmission hatches ensures mechanics can quickly repair the tank in the muddy field."
 spall_liners_tech:0 "Spall Liners"
 spall_liners_tech_desc:0 "Welding interior layers to the armor specifically to catch lethal metal shrapnel caused by explosive impacts."
 advanced_smoke_launchers_tech:0 "Advanced Smoke Launchers"
 advanced_smoke_launchers_tech_desc:0 "Integrated, 360-degree turret mortars that can instantly blind anti-tank crews in any direction."

 # Radios
 tank_radio_1_tech:0 "Basic Tank Radio"
 tank_radio_1_tech_desc:0 "Short-range AM radios to allow command tanks to coordinate with the wider armored formation."
 tank_radio_2_tech:0 "Radio Intercoms"
 tank_radio_2_tech_desc:0 "Equipping every tank with a receiver and internal throat-mics gives the platoon a massive tactical advantage in maneuvering."
 tank_radio_3_tech:0 "Advanced VHF Radio"
 tank_radio_3_tech_desc:0 "Crystal-tuned, static-free long-range radios that allow perfect coordination between armor, infantry, and air support."
 tank_heavy_machine_gun:0 "Anti-Air Machine Gun"

 coaxial_machine_guns:0 "Coaxial Machine Gun"
 coaxial_machine_guns_desc:0 "A secondary machine gun mounted alongside the main gun, providing extra defense against infantry and low-flying aircraft."
 
 close_defense_mortar:0 "Close Defense Mortar"
 close_defense_mortar_desc:0 "A roof-mounted mortar system designed to clear hostile infantry from the tank's immediate vicinity."
 
 early_optics:0 "Early Optics"
 early_optics_desc:0 "Basic prismatic sights and vision blocks that improve crew visibility and gunnery."
 
 improved_optics:0 "Improved Optics"
 improved_optics_desc:0 "High-quality lenses and periscopes that grant the crew superior battlefield awareness and target acquisition."
 
 range_finder:0 "Rangefinder"
 range_finder_desc:0 "An optical device used to accurately measure distance to targets, significantly improving first-round hit probability."
 
 advanced_range_finder:0 "Advanced Rangefinder"
 advanced_range_finder_desc:0 "Complex stereoscopic rangefinders that allow precise long-range gunnery and targeting of enemy weak spots."
 
 power_traverse:0 "Power Traverse"
 power_traverse_desc:0 "Electric or hydraulic turret drives that allow for rapid target acquisition during an assault."
 
 gyrostabilizer:0 "Gyrostabilizer"
 gyrostabilizer_desc:0 "A highly sensitive stabilization system that enables accurate main gun fire while the tank is moving."
 
 improved_ergonomics:0 "Improved Ergonomics"
 improved_ergonomics_desc:0 "Optimized internal layouts and better escape hatches that increase crew efficiency, maintenance ease, and survivability."
 
 spall_liners:0 "Spall Liners"
 spall_liners_desc:0 "Internal anti-fragmentation layers designed to protect the crew and critical components from armor spalling."
 
 advanced_smoke_launchers:0 "Advanced Smoke Launchers"
 advanced_smoke_launchers_desc:0 "An upgraded launcher system capable of deploying dense smoke screens or anti-personnel charges."