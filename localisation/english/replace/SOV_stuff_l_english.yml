 soviet.new.gosplan.t: "Directives for the State Planning Committee"
 soviet.new.gosplan.desc: "With the Five Year Plan actively underway, the State Planning Committee (Gosplan) is solidifying the structural framework for our ongoing economic expansion. To ensure our strict construction quotas are met on schedule, we must determine which geographic region will receive the heaviest concentration of state funding and administrative focus.\n\nBy establishing a long-term regional priority, Gosplan will heavily weight our industrial buildup toward that specific area across both Five Year Plans. This will allow us to optimize supply chains and maximize our total manufacturing output for both civilian and military sectors. The committee awaits our directive."
 soviet.new.gosplan.a: "Prioritize the agricultural and industrial heart of the Ukrainian SSR."
 soviet.new.gosplan.b: "Focus expansion around the Moscow region."
 soviet.new.gosplan.c: "Develop a secure, centralized industrial base in the Urals."
 soviet.new.gosplan.d: "Tap into the vast, unexploited resources of Siberia."
 SOV_gosplan_ukraine_rng_tt: "Five Year Plan missions will be highly weighted to target states within the §YUkrainian SSR§!."
 SOV_gosplan_moscow_rng_tt: "Five Year Plan missions will be highly weighted to target states in the §YMoscow region§!."
 SOV_gosplan_urals_rng_tt: "Five Year Plan missions will be highly weighted to target states in the §YUrals§!."
 SOV_gosplan_siberia_rng_tt: "Five Year Plan missions will be highly weighted to target states in §YSiberia§!."
 SOV_five_year_plan_dec_cat: "The Five Year Plan"
 #SOV_five_year_plan_dec_cat_desc: "The Second Five-Year Plan is entering its final stage. We have until the end of 1937 to fulfill the remaining industrial quotas set by the central committee.\n\nCurrent Plan Progress: [?SOV_five_year_plan_progress|Y0] / 100%\n\nThe Gosplan has laid out an ambitious roadmap for the industrialization of the Soviet Union. We have exactly two years to reach §G100% Fulfillment§!.\n\n§YThe Background Economy:§!\nEvery month, the plan passively generates §G1% Progress§! and accumulates §Y1 Civilian Factory§! into a central pool. This accumulated pool will be unleashed across the nation upon the successful completion of the Master Mission.\n\n§YActive Directives:§!\nWe can run up to §Y3 regional missions§! simultaneously. Completing these missions by constructing the requested Civilian Factories or Infrastructure will yield immediate regional rewards and a massive boost to overall Plan Progress. \n\n§YThe Hoarding Penalty:§!\nCompleting the Master Mission grants a long-lasting §GConsumer Goods reduction§!. However, Gosplan strictly punishes economic sabotage and hoarding. For every factory left sitting in the accumulated pool when the plan finishes, the duration of this Consumer Goods buff is reduced by §R10 Days§!. Fulfill quotas early to maximize the reward!\n\n§YAdjustments:§!\nThrough our National Focus tree, we can specialize our approach to either demand double the factory output from our missions, or vastly accelerated Progress. Should we fall behind schedule, the Central Committee can authorize a §Y30-day extension§! at the cost of Political Power."
 SOV_five_year_plan_mission_tt: "Reach §G100%§! Plan Progress."
 SOV_five_year_plan_reward_tt: "Will give one civilian factory in a random owned state per month waited to finish the five year plan.\n\nCurrent accumulated civs: [?SOV_accumulated_factories|Y0]\n\n"
 five_year_plan_decision_limit_tt: "Less than three ongoing missions"
 five_year_plan_focus_completion_tt: "This Focus will autocomplete upon completing the Second Five Year Plan"
 focus_on_progression_tt: "Second Five Year Plan missions will grant §Y4%§! progress instead of §Y3%§!. The infrastructure mission will grant double the resources."
 focus_on_factories_tt: "Second Five Year Plan missions will grant §Ytwo civilian factories§! and two building slots instead of one. The infrastructure mission will also grant two building slots."
