 # Updated Category Description
 SOV_five_year_plan_dec_cat_desc:0 "The Five-Year Plans are the central instrument of Soviet economic policy. Drafted by the State Planning Commission and ratified by the Central Committee, each plan sets binding construction quotas that the Soviet state must fulfill.\n\nCurrent Plan Progress: [?SOV_five_year_plan_progress|Y0] / 100%\n\n§YThe Second Five-Year Plan (1933–1937):§!\nThe Soviet Union has exactly §Ytwo years§! to reach §G100% Fulfillment§!. Every month, the plan passively generates §G1% Progress§! and accumulates §Y1 Civilian Factory§! into a central reserve pool. This pool is unleashed across the nation upon successful completion.\n\nWe can run up to §Y3 regional directives§! simultaneously. Completing them by constructing the requested factories or conducting resource surveys yields immediate rewards and boosts overall Plan Progress.\n\n§YThe Hoarding Penalty:§!\nFor every factory left sitting in the reserve pool when the plan concludes, the duration of the §GConsumer Goods reduction§! reward is cut by §R10 Days§!. Complete directives early to drain the pool and maximize the buff.\n\n§YSpecialization:§!\nThrough the Focus Tree, we may demand double factory output from our directives, or prioritize accelerated Plan Progress. Should we fall critically behind, the Central Committee can authorize a §Y30-day extension§! at the cost of stability and political power.\n\n§YThe Third Five-Year Plan (1938–1941):§!\nWith civilian industrialization secured, the plan shifts toward §Rwar preparation§!. Regional directives now target military factories, synthetic rubber production, and strategic resource extraction. This plan has no completion deadline, it runs until the war comes to us."

 SOV_second_five_year_plan_master_mission_reward:0 "Fruits of the Second Five-Year Plan"

