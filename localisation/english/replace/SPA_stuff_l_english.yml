l_english:
 
 SPA: "Republican Spain"
 SPA_democratic: "Republican Spain"
 SPA_communist: "Republican_Spain"
 
 SPA_status: "SPA ver0.1.0"
 SPA_status_desc: "Patch Notes: very scuffed"
 
 SPA_the_popular_front: "The Popular Front"
 SPA_the_popular_front_desc: "The danger posed by Fascism and religious superstitions to our personal liberties is paramount, and we must establish a broad front of political parties that are united in their opposition to the Right. Only if we band together will we be able to halt their advance and save our republic."
 SPA_secure_the_guardia_de_asalto: "Secure the Guardia de Asalto"
 SPA_secure_the_guardia_de_asalto_desc: "The polarization of society is increasing, and violence along with it. We must ensure the loyalty of the Assault Guards, our well-trained heavy police reserve. They will be invaluable if the violence continues to escalate."
 SPA_secure_the_guardia_de_asalto_tt: "Upon the start of the civil war, gain 3 trained units with §Y6 infantry§! battalions. The Nationalists gain 6 poorly-trained units with §Y3 infantry§! battalions.\n"
 SPA_secure_the_guardia_de_asalto_tt_2: "Upon the start of the civil war, gain 5 trained units with §Y6 infantry§! battalions. The Nationalists gain 10 poorly-trained units with §Y3 infantry§! battalions.\n"
 SPA_secure_the_guardia_get_both_types_tt: "§RIf neither focus is taken, the Nationalists will receive both types instead!§!\n"
 SPA_secure_the_guardia_civil: "Secure the Guardia Civil"
 SPA_secure_the_guardia_civil_desc: "Extremist elements continue to disrupt public order, and the frontline in the fight against civil unrest is the Guardia Civil. Ensuring the loyalty of our national police force must be our priority if we aim to stem the violence and maintain control."
 SPA_secure_the_guardia_civil_tt: "Upon the start of the civil war, gain 6 poorly-trained units with §Y3 infantry§! battalions. The Nationalists gain 3 trained units with §Y6 infantry§! battalions.\n"
 SPA_secure_the_guardia_civil_tt_2: "Upon the start of the civil war, gain 10 poorly-trained units with §Y3 infantry§! battalions. The Nationalists gain 5 trained units with §Y6 infantry§! battalions.\n"
 SPA_train_the_union_youth: "Train the Union Youth"
 SPA_train_the_union_youth_desc: "Rumblings of disloyalty emanate from the military, and we must be prepared for the worst. We will provide crash-courses in the use of weapons and basic military tactics to the dedicated and committed portions of our younger supporters, so that they may be armed at a moment's notice should the worst happen."
 SPA_train_the_union_youth_tt: "Upon the start of the civil war, gain 5 well-trained units with §Y3 infantry§! battalions.\n"
 SPA_enlarge_the_weapon_caches: "Enlarge the Weapon Caches"
 SPA_enlarge_the_weapon_caches_desc: "Ever since even before the 1934 Asturias Miners' Strike, weapon caches have been covertly established throughout the country, in preparation for the inevitable need to defend our liberties with military arms. In these times of crisis, we would do well to enlarge them further."
 SPA_enlarge_the_weapon_caches_tt: "Upon the start of the civil war, retain §Y80%§! of equipment, instead of §Y50%§!.\n"
 SPA_distribute_arms_to_the_people: "Distribute Arms to the People"
 SPA_distribute_arms_to_the_people_desc: "Disloyalty in the military is now all but certain, and it is clear we cannot rely on them to defend the values of the Republic. We should begin disseminating arms to those who carry the best interests of the Republic at heart, so that they may form the first defense against a possible rebellion."
 SPA_distribute_arms_to_the_people_tt: "Upon the start of the civil war, gain 10 untrained units with §Y3 infantry§! battalions.\n"
 SPA_disband_the_army: "Disband the Army"
 SPA_disband_the_army_desc: "We can no longer ignore the signs of disloyalty in the military. Even if it may spark the plotters into action, we have no choice but to attempt to disband the army with immediate effect, and seize the initiative."
 
 
 SPA_maintain_the_second_republic: "Save the Second Republic!"
 SPA_maintain_the_second_republic_desc: "The rebellious military has not succeeded in its coup attempt, and our government maintains its ability to rule in freedom. The Second Republic shall prevail against the threat of the Right, just as it prevailed over the miners' strike in 1934."
 
 SPA_petition_for_french_aid: "Petition for French Aid"
 SPA_petition_for_french_aid_desc: "Our neighbors to the north hesitate in their desire to lend us aid, cowed by the prospect of internal unrest should they take any action at all. We cannot allow them to remain so indecisive; our very survival depends on their willingness to act."

 SPA_international_brigades: "International Brigades"
 SPA_international_brigades_desc: "WIP"
 
