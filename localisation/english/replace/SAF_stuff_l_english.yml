SAF_unrest_level_0:0 "Total Social Cohesion"
SAF_unrest_level_0_desc:0 "Through extensive integration programs, public concessions, and state welfare, racial and systemic friction in South Africa has been functionally neutralized. The population looks toward a unified future."
SAF_unrest_level_1:0 "Negligible Dissatisfaction"
SAF_unrest_level_1_desc:0 "While underlying institutional inequalities remain a point of discussion among intellectual circles and community leaders, open public resentment is isolated and rare."
SAF_unrest_level_2:0 "Minority Discontent"
SAF_unrest_level_2_desc:0 "Frustrations regarding segregationist laws are beginning to manifest in localized labor unions and community organizations. Though peaceful, the murmur of pushback is audible."
SAF_unrest_level_3:0 "Moderate Segregation Grievances"
SAF_unrest_level_3_desc:0 "Dissatisfaction with the current social framework is becoming mainstream. Wildcat strikes and non-violent public demonstrations are stretching municipal resources thin."
SAF_unrest_level_4:0 "Substantial Civil Friction"
SAF_unrest_level_4_desc:0 "The dividing lines across South African society are fracturing under pressure. Organized boycotts of public infrastructure and targeted industrial actions are directly impacting economic output."
SAF_unrest_level_5:0 "High Social Unrest"
SAF_unrest_level_5_desc:0 "The demographic majority is in active defiance of state segregation policies. Protests are widespread, political gridlock holds steady in the capital, and economic productivity is noticeably lagging."
SAF_unrest_level_6:0 "Severe Civil Defiance"
SAF_unrest_level_6_desc:0 "Large-scale clashes between demonstrators and municipal law enforcement have become a regular feature of urban life. The authority of the state is openly questioned across major provinces."
SAF_unrest_level_7:0 "Widespread Insurgency Danger"
SAF_unrest_level_7_desc:0 "South Africa stands on a knife's edge. Mainstream political pathways have completely broken down, driving underground resistance movements to actively sabotage state infrastructure."
SAF_unrest_level_8:0 "Critical National Fracture"
SAF_unrest_level_8_desc:0 "The social fabric has unraveled. Total civil breakdown and coordinated revolutionary actions have brought domestic industry to a complete standstill. The state is fighting for its literal survival."
