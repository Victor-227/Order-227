SAF_segregation_management_desc:0"§YCurrent Dissatisfaction§!:§R [?ROOT.saf_segregation_dissatisfaction]%§!\n \n \nFollowing the unification of the provinces, the Union ofSouth Africa has inherited a fragile, deeply fractured social landscape. As industrial centers expand along the Witwatersrand, the stark dividing lines of institutional segregation place our administration under intense scrutiny. To many within our parliamentary halls, maintaining the rigid structures of separation is viewed as a paramount matter of national stability and labor security. Yet beneath the surface, a dangerous pressure is mounting. Organized strikes, community boycotts, and underground resistance networks are gaining momentum by the day.\n\ \n\n§YPassive Growth:§! Segregation Dissatisfaction increases by §R+3§! at the start of every month.\n \n§YManaging Unrest:§! Utilize the decisions and focuses to lower the metric at the cost of temporary industrial or political penalties. Spirit can be removed by doing a focus\n"



