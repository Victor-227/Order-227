l_english:

BRA_tribunal_nacional: "Tribunal de Segurança Nacional"
BRA_tribunal_nacional_desc: "Tribunal de Segurança Nacional"

BRA_cohenplan: "The Cohen Plan"
BRA_cohenplan_desc: "With elections on the horizon and our support among the electorate waning, we need to ensure the continuation of our regime by other means. By forging plans for another communist coup, we can reinvigorate support for ourselves whilst suspending the elections for the sake of national security."

BRA_polaca: "The Polaca"
BRA_polaca_desc: "While there are few left who have the capacity to mount a serious threat to our regime, it would increase our legitimacy if we drafted a new constitution which outlines the powers of the president. Perhaps we can look to the recently enacted 1935 Polish constitution for inspiration."

BRA_tenentism_legacy: "Legacy of Tenentism"
BRA_cohenplan_desc: "If we are to modernize the Brazilian nation, it will be beneficial for us to work with and use the legacy of the remaining tenentists to achieve social reforms."

BRA_towards_autarky: "Towards Autarky"
BRA_towards_autarky_desc: "Economic turmoil following the Wall Street Crash rippled across the globe and destroyed our economy. From the consumption of coffee to the production of steel, we must become self-sufficient in all things and insulate ourselves from any future foreign crisis."

BRA_DASP: "Establish DASP"
BRA_DASP_desc: "The machinery of state that allows our government's policies to be implemented has become antiquated and stale. We shall establish the Departamento Administrativo do Serviço Público (DASP) to help us more effectively govern the nation and maintain economic efficiency."

BRA_decree_37: "Decree No. 37"
BRA_decree_37_desc: "The previous regime was riddled with corruption and domestic squabbles due to some states having an out of proportion influence over national politics. We should therefore crack down on any expressions of regionalism and concentrate power in the national government."

BRA_queremos_vargas: "Queremos Getúlio!"
BRA_decree_37_desc: "Queremos Getúlio, Queremos Vargas, the people chant  , not only is the power of our regime within brazil solidified but the brazilian people have come to embrace it with popular popularity as well!"

BRA_consolidation_labor: "Consolidation of Labor Laws"
BRA_consolidation_labor_desc: "Our labor laws offer little protection for workers, which inevitably leads to disagreements with business owners and ultimately strikes. At such a perilous time, we can not afford such strikes or the risk of Bolshevik infiltration. We will therefore consolidate our laws and find a balance between the workers and the capitalists."

BRA_duce: "The Heavy Hand of Our Duce"
BRA_duce_desc: "Heavy is the hand that wears the crown, and heavy is the hand that leads the nation into a new state, in the hands of Vargas is now full dictatorial power comparable to the one of right-wing european dictators."

BRA_departmento_de_propaganda: "Departamento de Propaganda"
BRA_departmento_de_propaganda_desc: "The recent decade of political turmoil shows all too well what can happen when the government and the people are not aligned in their views. To prevent any further turmoil, we shall establish a department of propaganda to nudge the people into alignment with our policies."

BRA_crush_communists: "Crush Communism"
RA_crush_communists_desc: "In fallout of the 1935 revolution, many urban workers are still loyal to the cause of socialism, this conflicts with our current plans of a new state modeled after nationalist europan dictatorships."

BRA_ban_parties: "Ban Political Parties"
BRA_ban_parties_desc: "Political parties have proven to be nothing more than tools for division and disruption. By banning and eliminating them, we can curtail the ability of radicals to organize against us."

BRA_a_nation_to_the_immigrant: "A Nation To The Immigrant"
BRA_ban_parties_desc: "Brazil is a diverse nation with people whose ancestry stretches across the globe. With our economy growing once more and an abundance of resources waiting to be tapped, it’s time we encourage more people to move here and call themselves Brazilian too."

BRA_rural_literacy: "Rural Literacy Programmes"
BRA_rural_literacy_desc: "How can we administer propaganda to the people if they cannot read? The oligarchic first republic allowed people who followed a large set of requirements to vote, with one of those requirements being literacy, however the literacy of our nation is horrendous for a 20th century country especially within rural Brazil, we need government programs to increase the literacy of the rural nrazilians"

BRA_university_sao_paulo: "University of Sao Paulo"
BRA_university_sao_paulo_desc: "The University of São Paulo was only recently established, yet the benefits of it are already being felt throughout the Brazilian economy. We should capitalize on this by investing more into this burgeoning institution."

BRA_the_centralization_of_power: "The Centralization of Power"
BRA_the_centralization_of_power_desc: "Brazil is a nation of many cultures spread across a vast territory. If we don’t do more to unite the diverse states of the nation, we run the risk of fragmentation or even military incursions from our neighbors. Only through a strong central government can we hope to protect our nation."

